name: Build TRADEIA Haiti APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-22.04

steps:
  - name: Telechaje pwojè a
    uses: actions/checkout@v4

  - name: Prepare Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Enstale zouti konstriksyon yo
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        git zip unzip \
        openjdk-17-jdk \
        python3-pip \
        autoconf automake libtool \
        pkg-config zlib1g-dev \
        libncurses5-dev libncursesw5-dev \
        libtinfo6 cmake libffi-dev \
        libssl-dev

  - name: Enstale Buildozer
    run: |
      python -m pip install --upgrade pip
      pip install buildozer cython==0.29.33

  - name: Konstwi APK la
    run: buildozer android debug

  - name: Sove APK la kòm yon fichye pou telechaje
    uses: actions/upload-artifact@v4
    with:
      name: TRADEIA-Haiti-APK
      path: bin/*.apk
      if-no-files-found: error